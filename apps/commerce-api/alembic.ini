[alembic]
# Migrations live in apps/commerce-api/alembic/
script_location = alembic

# File naming template (revision prefix keeps migrations sortable by date)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Silence the "No changes in schema detected" output during autogenerate checks
output_encoding = utf-8

# sqlalchemy.url is NOT set here — it is read from DATABASE_URL in env.py.
# This prevents the URL (including credentials) from ever appearing in a
# committed config file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
