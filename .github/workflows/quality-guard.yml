name: Quality Guard

on:
  pull_request: {}
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  diff-guard:
    name: Diff guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff range
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha='${{ github.event.pull_request.base.sha }}'
            head_sha='${{ github.event.pull_request.head.sha }}'
          else
            base_sha='${{ github.event.before }}'
            head_sha='${{ github.sha }}'
            if [ -z "${base_sha}" ] || [[ "${base_sha}" =~ ^0+$ ]]; then
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi
          if [ -z "${base_sha}" ]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi
          echo "base=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "head=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Run diff guard
        run: python3 scripts/quality_guard.py --base "${{ steps.diff.outputs.base }}" --head "${{ steps.diff.outputs.head }}"

  backend-quality:
    name: Backend tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=15

  frontend-quality:
    name: Frontend analyze + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Get packages
        working-directory: frontend
        run: flutter pub get

      - name: Run analyze and tests
        working-directory: frontend
        run: |
          flutter analyze
          flutter test