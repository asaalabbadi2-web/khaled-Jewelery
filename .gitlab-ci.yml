stages:
  - build
  - deploy

# ─────────────────────────────────────────────
# Shared Docker build config
# ─────────────────────────────────────────────
.docker-build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─────────────────────────────────────────────
# Build backend image
# ─────────────────────────────────────────────
build-backend:
  extends: .docker-build
  script:
    - |
      docker build \
        -t "$CI_REGISTRY_IMAGE/backend:latest" \
        -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" \
        -f backend/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"

# ─────────────────────────────────────────────
# Build frontend (Flutter web + nginx) image
# ─────────────────────────────────────────────
build-web:
  extends: .docker-build
  script:
    - |
      docker build \
        --build-arg API_BASE_URL=/api \
        -t "$CI_REGISTRY_IMAGE/web:latest" \
        -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" \
        -f frontend/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/web:latest"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"

# ─────────────────────────────────────────────
# Deploy to production via local Windows runner
# ─────────────────────────────────────────────
deploy-production:
  stage: deploy
  tags:
    - windows-docker
  needs:
    - build-backend
    - build-web
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - cd C:\khaled-jewelery
    - docker compose -f docker-compose.prod.images.yml --env-file .env.production pull
    - docker compose -f docker-compose.prod.images.yml --env-file .env.production up -d --remove-orphans
    - docker image prune -f
    - echo "Deploy completed successfully"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
