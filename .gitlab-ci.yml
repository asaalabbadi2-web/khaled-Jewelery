stages:
  - test
  - build
  - deploy

# ─────────────────────────────────────────────
# Web (Next.js storefront) — 7 CI gates
# Runs only when apps/web/** or packages/contracts/** change.
# DO NOT modify Python/backend jobs above or below.
# ─────────────────────────────────────────────
web-test:
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install --frozen-lockfile
  script:
    # Gate 1: TypeScript
    - pnpm --filter web typecheck
    # Gate 2: ESLint (covers no-hex-color + jsx-a11y)
    - pnpm --filter web lint
    # Gate 3: State coverage + server-clock unit tests (red→green demo for HALTED)
    - pnpm --filter web test --run
    # Gate 4: Brand guard
    - node apps/web/scripts/brand-guard.mjs
    # Gate 5: Import direction
    - pnpm --filter web depcruise src
    # Gate 6: Build (catches missing server components / import errors)
    - pnpm --filter web build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/web/**/*
        - packages/contracts/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/web/**/*
        - packages/contracts/**/*

# ─────────────────────────────────────────────
# Shared Docker build config
# ─────────────────────────────────────────────
.docker-build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─────────────────────────────────────────────
# Build backend image
# ─────────────────────────────────────────────
build-backend:
  extends: .docker-build
  script:
    - |
      docker build \
        --build-arg BUILD_DATE="$(date -u +%Y%m%dT%H%M%SZ)" \
        -t "$CI_REGISTRY_IMAGE/backend:latest" \
        -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" \
        -f backend/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"

# ─────────────────────────────────────────────
# Build frontend (Flutter web + nginx) image
# ─────────────────────────────────────────────
build-web:
  extends: .docker-build
  script:
    - |
      docker build \
        --build-arg API_BASE_URL=/api \
        -t "$CI_REGISTRY_IMAGE/web:latest" \
        -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" \
        -f frontend/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/web:latest"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"

# ─────────────────────────────────────────────
# Deploy to production via local Windows runner
# ─────────────────────────────────────────────
deploy-production:
  stage: deploy
  tags:
    - windows-docker
  needs:
    - build-backend
    - build-web
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - cd C:\khaled-jewelery
    - docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production pull
    - docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production up -d --remove-orphans
    - echo "Deploy completed successfully"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
