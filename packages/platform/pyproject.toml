[project]
name = "yasargold-platform"
version = "0.1.0"
description = "Infrastructure utilities — database, dates, numbers, settings"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "flask-sqlalchemy>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yasargold_platform"]
