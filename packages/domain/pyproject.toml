[project]
name = "yasargold-domain"
version = "0.1.0"
description = "Business domain logic — pricing, accounting, inventory, settlements"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "yasargold-platform",
]

[tool.uv.sources]
yasargold-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yasargold_domain"]
