server {
    listen 8001;

    # Use Docker's embedded DNS (127.0.0.11) so nginx re-resolves 'erp'
    # after every container restart instead of caching the old IP forever.
    # valid=5s: re-query every 5 s at most.
    resolver 127.0.0.11 valid=5s;
    set $erp_upstream http://erp:8001;

    location / {
        proxy_pass         $erp_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
